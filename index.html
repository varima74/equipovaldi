<meta name="theme-color" content="#084b9b">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#084b9b}
  iframe{display:block;border:0;width:100%;height:100%;height:100dvh;background:#fff}
  .aviso{font:15px/1.4 system-ui,Roboto,Arial,sans-serif;color:#fff;padding:24px;text-align:center}

<body>
<noscript><p class="aviso">Para registrarte activa JavaScript o entra en
  <a href="https://script.google.com/macros/s/AKfycbxn6j0XeoGSRlc0oVgFY4b9wEegxBEFzdcVgD2mcsvHweZONiHohogtFT94izquhu4p/exec">este enlace</a>.</p></noscript>
<script>
  // Dirección de la aplicación web de Apps Script (la /exec de la implementación activa).
  var APP = 'https://script.google.com/macros/s/AKfycbxn6j0XeoGSRlc0oVgFY4b9wEegxBEFzdcVgD2mcsvHweZONiHohogtFT94izquhu4p/exec';
  // Pasa el ?ref= de quien invita a la aplicación.
  var ref = new URLSearchParams(location.search).get('ref');
  var src = APP + (ref && /^[0-9a-f-]{36}$/i.test(ref) ? '?ref=' + ref : '');
  var f = document.createElement('iframe');
  f.src = src;
  f.title = 'Registro José Juan Sánchez Barba';
  f.allow = 'camera; clipboard-write';
  document.body.appendChild(f);
</script>
</body>
